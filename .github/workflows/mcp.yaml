# MCP server (given in S7): test and build the mcp image, then run it on the app host
# (deploy/compose.mcp.yaml) through its self-hosted runner. Off until you set (stages/S7.md):
#   gh variable set LAB_MCP --body on
# Push-triggered only: a fork's pull request can't run anything here.
name: mcp

on:
  push:
    branches: [main]
    paths:
      - "mcp/**"
      - "contracts/mcp-tools.json"
      - "deploy/compose.mcp.yaml"
      - ".github/workflows/mcp.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp
  cancel-in-progress: false

jobs:
  test:
    if: vars.LAB_MCP == 'on'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
      - run: make test-mcp

  image:
    needs: test
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.img.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Image name and tag
        id: img
        run: |
          echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7.4.0
        with:
          context: mcp
          platforms: linux/arm64
          push: true
          tags: ${{ steps.img.outputs.prefix }}/mcp:${{ steps.img.outputs.tag }}
          build-args: GIT_SHA=${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=mcp
          cache-to: type=gha,scope=mcp,mode=max

  deploy:
    needs: image
    runs-on: [self-hosted, lab-app]
    permissions:
      contents: read
      packages: read
    env:
      MCP_TAG: ${{ needs.image.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy
        run: |
          export IMAGE_PREFIX="ghcr.io/${GITHUB_REPOSITORY,,}"
          deploy/web.sh init
          docker compose -f deploy/compose.mcp.yaml pull
          docker compose -f deploy/compose.mcp.yaml up -d --wait
      - name: Tools and database privileges
        # The read-only user's privileges as Redshift reports them: read marts, nothing else.
        run: docker exec lab-mcp-mcp-1 python -c "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8002/healthz?db=1', timeout=60).read().decode())"
