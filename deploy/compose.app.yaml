# App host stack (contracts/runtime.yaml: traefik, app; serving and mcp join in S3 and S7).
# The CD workflow runs this on the app host's self-hosted runner:
#   IMAGE_PREFIX=ghcr.io/<owner>/<repo> IMAGE_TAG=<tag> docker compose -f deploy/compose.app.yaml up -d
# Containers restart with the Docker daemon, so the stack comes back on its own after a session refresh.
name: lab-app

services:
  traefik:
    image: traefik:v3.7.13
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      # File provider only: no Docker socket, so Traefik has no root-equivalent access to the host.
      - ./traefik/traefik.yaml:/etc/traefik/traefik.yaml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
    depends_on:
      app:
        condition: service_healthy

  app:
    image: ${IMAGE_PREFIX:?set IMAGE_PREFIX}/app:${IMAGE_TAG:?set IMAGE_TAG}
    restart: unless-stopped
    environment:
      IMAGE_TAG: ${IMAGE_TAG}
    expose:
      - "8000"
