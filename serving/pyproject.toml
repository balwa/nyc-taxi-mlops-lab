[project]
name = "servingapp"
version = "0.1.0"
description = "Model serving: one MLflow alias per container (contracts/serving-openapi.yaml)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.143.0",
  "uvicorn==0.54.0",
  "mlflow-skinny==3.17.0",
  "prometheus-client==0.26.0",
  # The model is a pickle: these must match the pipeline's pins (tools/check_pins.py checks).
  "lightgbm==4.7.0",
  "pandas==3.0.6",
  "numpy==2.5.3",
]

[dependency-groups]
# mlflow (full) only for the tests' local registry; the image has mlflow-skinny.
dev = ["pytest==9.1.1", "httpx2==2.13.1", "pyyaml==6.0.3", "jsonschema==4.26.0", "mlflow==3.17.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/servingapp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
