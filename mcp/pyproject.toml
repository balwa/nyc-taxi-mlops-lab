[project]
name = "labmcp"
version = "0.1.0"
description = "MCP server for the support assistant (S7): the model, predictions and zone statistics as tools"
requires-python = ">=3.12,<3.13"
dependencies = [
  # 1.x: the FastMCP API this skeleton uses. Streamable HTTP transport.
  "mcp==1.30.0",
  "boto3==1.43.109",
  "httpx==0.28.1",
]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.3.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/labmcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
