[project]
name = "rideapp"
version = "0.1.0"
description = "Ride-hailing app backend: quotes trip durations (S0: static median stub)"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.142.2",
  "uvicorn==0.54.0",
  "httpx2==2.13.1",
  "tzdata==2026.5",
  "prometheus-client==0.26.0",
  "psycopg[binary]==3.3.5",
  "mcp==1.30.0",  # S7: the MCP client for the assistant's tools
]

[dependency-groups]
dev = ["pytest==9.1.1", "httpx2==2.13.1", "pyyaml==6.0.3", "jsonschema==4.26.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rideapp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
